[package]
name = "nystromformer"
version = "0.1.0"
edition = "2024"

[dependencies]
ark-bn254 = "0.5.0"
ark-crypto-primitives = "0.5.0"
ark-ff = "0.5.0"
ark-groth16 = "0.5.0"
ark-poly = "0.5.0"
ark-r1cs-std = { version = "0.5.0", optional = true, default-features = false }
ark-relations = "0.5.1"
ark-std = "0.5.0"
ark-bls12-381 = { version = "0.5.0", default-features = false, features = ["curve", "std"] }
ark-ec = {version ="0.5.0",  default-features = false}
rand = "0.8"
ark-serialize = { version = "0.5.0", features = ["derive"] }
ndarray = "0.15.6"
ndarray-npy = "0.8.1" 
matrixmultiply = "0.3.10"
anyhow = "1.0"

# --- 추가 (from duplex-rs) ---
bit-vec = { version = "0.6", features = ["serde"] }
serde = { version = "1.0.159", features = ["derive", "rc"] }
ark-nonnative-field = { version = "0.3.0", optional = true, default-features = false }

# concurrency / utils
rayon = { version = "1.7.0", optional = true }
tracing = { version = "0.1.37", optional = true }
derivative = { version = "2.2.0", default-features = false, optional = true }

# crypto / utilities
ark-sponge = "0.3.0"
lazy_static = "1.4.0"
serde_json = "1.0.108"
dock_crypto_utils = { version = "0.10.0", default-features = false }
digest = { version = "0.10.6", default-features = false }
merlin = { version = "3.0.0", default-features = false }
sha3 = { version = "0.10.7", default-features = false }

# parsing / macros / collections / misc
pest = { version = "2.5.7", features = ["std"] }
pest_derive = "2.5.7"
hashbrown = "0.13.2"
itertools = "0.10.5"
paste = "1.0.12"

# rand core / numeric libs
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
num-traits = "0.2.15"
num-bigint = { version = "0.4.5", features = ["rand"] }
num-primes = "0.3.0"
rsa = "0.6"
num-integer = "0.1.46"

[features]
default = ["parallel"]
std = [
    "ark-ff/std",
    "serde/std",
    "r1cs",
    "ark-ec/std",
    "ark-poly/std",
    "ark-relations/std",
    "ark-crypto-primitives/std",
    "ark-std/std",
]
parallel = [
    "std",
    "ark-ff/parallel",
    "ark-poly/parallel",
    "ark-ec/parallel",
    "ark-crypto-primitives/parallel",
    "ark-std/parallel",
    "rayon",
]
print-trace = ["ark-std/print-trace"]
r1cs = [
    "ark-crypto-primitives/r1cs",
    "ark-r1cs-std",
    "tracing",
    "derivative",
    "ark-nonnative-field",
]
serde-compat = ["serde/std"]

[dev-dependencies]
ark-ed-on-bn254 = { version = "0.5.0", default-features = false, features = ["r1cs"] }
ark-bls12-377 = { version = "0.5.0", default-features = false, features = ["curve", "r1cs"] }
ark-bls12-381 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ed-on-bls12-381 = { version = "0.5.0", default-features = false, features = ["r1cs"] }
blake2 = "0.10.6"
num-traits = { version = "0.2.15", default-features = false }
rand_chacha = "0.3.1"
tracing-subscriber = { version = "0.3.17", features = ["fmt"] }
