[package]
name = "nystromformer"
version = "0.1.0"
edition = "2024"
description = "Nystromformer with LASSO SNARK lookup argument"

[dependencies]
# --- Core Math & ZKP (arkworks 0.5.x 기준 통일) ---
ark-bn254 = "0.5.0"
ark-ff = { version = "0.5.0", default-features = false }
ark-ec = { version = "0.5.0", default-features = false }
ark-poly = "0.5.0"
ark-std = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false, features = ["derive"] }
ark-relations = "0.5.1"
ark-crypto-primitives = "0.5.0"
ark-groth16 = "0.5.0"
ark-bls12-381 = { version = "0.5.0", default-features = false, features = ["curve", "std"] }
ark-curve25519 = "0.5.0" # Lasso용 (0.4.0 -> 0.5.0 상향)

# --- Lasso Specific Dependencies ---
merlin = "3.0.0"
digest = "0.8.1" 
sha3 = "0.8.2"  
subtle = { version = "2.4", default-features = false }
zeroize = { version = "1", default-features = false }
itertools = "0.10.0"
colored = "2.0.0"
thiserror = "1.0"
seq-macro = "0.3.3"
hashbrown = "0.14.0"
rayon = { version = "1.7.0", optional = true } 

# --- Tracing & CLI ---
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
tracing-texray = "0.2.0"
clap = { version = "4.3.10", features = ["derive"] }

# --- Linear Algebra & Utilities ---
ndarray = "0.15.6"
ndarray-npy = "0.8.1" 
matrixmultiply = "0.3.10"
anyhow = "1.0"
rand = "0.8" # 0.8로 통일
rand_core = { version = "0.6", default-features = false } # 0.6으로 상향
rand_chacha = { version = "0.3.1", default-features = false }
num-bigint = { version = "0.4.5", features = ["rand"] }
num-traits = "0.2.15"
num-integer = "0.1.46" # 0.1.46으로 통일

# --- Optional R1CS ---
ark-r1cs-std = { version = "0.5.0", default-features = false}

[features]
default = ["parallel", "multicore"]
std = [
    "ark-ff/std",
    "ark-ec/std",
    "ark-poly/std",
    "ark-relations/std",
    "ark-crypto-primitives/std",
    "ark-std/std",
]
parallel = [
    "std",
    "ark-ff/parallel",
    "ark-poly/parallel",
    "ark-ec/parallel",
    "ark-crypto-primitives/parallel",
    "ark-std/parallel",
]
multicore = ["rayon"]
r1cs = [
    "ark-crypto-primitives/r1cs",
]

[dev-dependencies]
ark-ed-on-bn254 = { version = "0.5.0", default-features = false, features = ["r1cs"] }
ark-bls12-377 = { version = "0.5.0", default-features = false, features = ["curve", "r1cs"] }
ark-bls12-381 = { version = "0.5.0", default-features = false, features = ["curve"] }
blake2 = "0.10.6"
criterion = { version = "0.3.1", features = ["html_reports"] }

[profile.release]
debug = true
codegen-units = 1
lto = "fat"

[[bench]]
path = "src/lasso/benches/dimensions.rs" 
name = "dimensions"
harness = false